
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barun AI Image Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10111b;
  color: white;
}

header {
  padding: 22px 15px;
  text-align: center;
  background: #191b2b;
  border-bottom: 1px solid #303247;
}

header h1 {
  margin: 0;
  font-size: 27px;
  color: #a78bfa;
}

header p {
  color: #aaa;
  margin-bottom: 0;
}

.container {
  width: 92%;
  max-width: 700px;
  margin: 25px auto;
}

.box {
  background: #1c1e30;
  padding: 22px;
  border-radius: 18px;
  border: 1px solid #34364d;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin: 17px 0 8px;
  color: #ddd;
}

textarea, select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #454760;
  background: #10111b;
  color: white;
  font-size: 15px;
  outline: none;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg,#7c3aed,#2563eb);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#status {
  text-align: center;
  margin: 17px 0;
  color: #c4b5fd;
}

#result img {
  width: 100%;
  border-radius: 12px;
  margin-top: 15px;
}

.download {
  display: block;
  text-align: center;
  text-decoration: none;
  background: #16a34a;
  color: white;
  padding: 14px;
  margin-top: 15px;
  border-radius: 10px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
}
</style>
</head>

<body>

<header>
  <h1>✨ Barun AI Studio</h1>
  <p>Create Amazing AI Images For Free</p>
</header>

<div class="container">

  <div class="box">

    <h2>🎨 AI Image Generator</h2>

    <p>Describe your imagination and create an AI image.</p>

    <label for="prompt">Image Description</label>

    <textarea
      id="prompt"
      placeholder="Example: A beautiful realistic village beside a river at sunset, cinematic lighting..."
    ></textarea>

    <label for="style">Choose Image Style</label>

    <select id="style">
      <option value="Photorealistic">Photorealistic</option>
      <option value="3D Animation">3D Animation</option>
      <option value="Cartoon">Cartoon</option>
      <option value="Anime">Anime</option>
      <option value="Cinematic">Cinematic</option>
      <option value="Digital Art">Digital Art</option>
    </select>

    <button id="generateBtn" onclick="createImage()">
      ✨ Generate Image
    </button>

    <div id="status"></div>

    <div id="result"></div>

  </div>

</div>

<footer>
  © 2026 Barun AI Studio | Powered by AI
</footer>

<script>

async function createImage() {

  const prompt = document.getElementById("prompt").value.trim();
  const style = document.getElementById("style").value;
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const button = document.getElementById("generateBtn");

  if (!prompt) {
    status.innerText = "Please describe your image first!";
    return;
  }

  button.disabled = true;
  button.innerText = "⏳ Generating...";
  status.innerText = "AI is creating your image. Please wait...";
  result.innerHTML = "";

  try {

    const response = await fetch(
      "https://barun-ai-image.barunr426.workers.dev/api/generate-image",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          prompt: prompt,
          style: style
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Image generation failed");
    }

    if (!data.image_url) {
      throw new Error("No image received from AI");
    }

    const img = document.createElement("img");
    img.src = data.image_url;
    img.alt = "AI Generated Image";

    result.appendChild(img);

    const download = document.createElement("a");
    download.href = data.image_url;
    download.download = "Barun-AI-Image.png";
    download.className = "download";
    download.innerText = "⬇ Download Image";

    result.appendChild(download);

    status.innerText = "✅ Image created successfully!";

  } catch (error) {

    status.innerText = "❌ " + error.message;

  } finally {

    button.disabled = false;
    button.innerText = "✨ Generate Image";

  }

}

</script>

</body>
</html>
