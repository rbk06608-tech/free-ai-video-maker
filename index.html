<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Video Maker</title>
</head>
<body>

  <h1>🎬 Free AI Video Maker</h1>
  <p>বাংলা বা English-এ তোমার গল্প লিখে ভিডিও তৈরির শুরু করো।</p>

  <textarea id="story" placeholder="এখানে তোমার গল্প বা অনুভূতি লিখুন..."></textarea>

  <br><br>

  <button onclick="generate()">ভিডিও তৈরি করুন</button>

  <p id="result"></p>

  <script>
    function generate() {
      const story = document.getElementById("story").value;

      if (!story.trim()) {
        document.getElementById("result").innerText =
          "আগে একটি গল্প লিখুন।";
        return;
      }

      document.getElementById("result").innerText =
        "আপনার গল্প গ্রহণ করা হয়েছে। 🎬";
    }
  </script>

</body>
</html>
