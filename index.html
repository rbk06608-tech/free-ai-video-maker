<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Dance Video Maker</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 background:linear-gradient(135deg,#eef2ff,#fdf2f8);
 color:#111827;
}

.container{
 width:92%;
 max-width:650px;
 margin:25px auto;
}

.card{
 background:white;
 padding:22px;
 border-radius:24px;
 box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.logo{
 text-align:center;
 font-size:30px;
 font-weight:800;
}

.subtitle{
 text-align:center;
 color:#6b7280;
 margin:10px 0 25px;
}

label{
 display:block;
 font-weight:bold;
 margin:18px 0 8px;
}

input,textarea,select{
 width:100%;
 padding:14px;
 border:1px solid #d1d5db;
 border-radius:13px;
 font-size:16px;
 background:#fff;
}

textarea{
 min-height:110px;
 resize:vertical;
}

button{
 width:100%;
 margin-top:22px;
 padding:16px;
 border:0;
 border-radius:14px;
 background:#4f46e5;
 color:white;
 font-size:18px;
 font-weight:bold;
}

button:disabled{
 opacity:.6;
}

.info{
 margin-top:18px;
 padding:14px;
 border-radius:14px;
 background:#f3f4f6;
 color:#4b5563;
 font-size:14px;
}

#status{
 text-align:center;
 margin-top:18px;
 font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">🎬 AI Dance Video Maker</div>

<div class="subtitle">
ছবি + গান + Dance Reference দিয়ে AI ভিডিও তৈরি করুন
</div>

<label>🖼️ আপনার ছবি</label>

<input
 type="file"
 id="image"
 accept="image/*">

<label>🎵 গান / Audio</label>

<input
 type="file"
 id="audio"
 accept="audio/*">

<label>💃 Dance Reference Video</label>

<input
 type="file"
 id="danceVideo"
 accept="video/*">

<label>📝 কীভাবে নাচবে?</label>

<textarea
 id="prompt"
 placeholder="যেমন: মানুষটি হাসিমুখে গানের তালে নাচবে, মাথা ও হাত স্বাভাবিকভাবে নড়বে, চোখের পলক ফেলবে এবং মুখের expression গানটির সঙ্গে মিলবে।">
</textarea>

<label>🎭 Dance Style</label>

<select id="style">
<option>Natural Dance</option>
<option>Bollywood Dance</option>
<option>Bangla Viral Dance</option>
<option>Romantic Dance</option>
<option>Energetic Dance</option>
<option>Slow Motion Dance</option>
</select>

<label>⏱️ Video Duration</label>

<select id="duration">
<option value="5">5 Seconds</option>
<option value="8">8 Seconds</option>
<option value="10">10 Seconds</option>
</select>

<button id="generate" onclick="generateVideo()">
🤖 AI Generate Video
</button>

<div id="status"></div>

<div class="info">
⚠️ এখন এটি AI generation request-এর interface।
পরের ধাপে নিরাপদ server/backend-এর মাধ্যমে AI video model যুক্ত করা হবে।
</div>

</div>

</div>

<script>

function generateVideo(){

 const image=document.getElementById("image").files[0];
 const audio=document.getElementById("audio").files[0];
 const dance=document.getElementById("danceVideo").files[0];

 const prompt=document.getElementById("prompt").value.trim();

 const status=document.getElementById("status");
 const button=document.getElementById("generate");

 if(!image){
   alert("আগে একটি ছবি Upload করুন।");
   return;
 }

 if(!audio){
   alert("আগে একটি গান বা Audio Upload করুন।");
   return;
 }

 if(!dance){
   alert("Dance Reference Video Upload করুন।");
   return;
 }

 if(!prompt){
   alert("কীভাবে নাচবে সেটি লিখুন।");
   return;
 }

 button.disabled=true;

 status.innerText="⏳ AI Video তৈরির জন্য প্রস্তুত হচ্ছে...";

 setTimeout(function(){

   status.innerText=
   "✅ সব তথ্য প্রস্তুত। এখন AI backend যুক্ত করলেই ভিডিও তৈরি হবে।";

   button.disabled=false;

 },1500);

}

</script>

</body>
</html>
