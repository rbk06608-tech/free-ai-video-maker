<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Video Maker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:linear-gradient(135deg,#eef2ff,#fdf2f8);
  color:#111827;
}

.container{
  width:92%;
  max-width:650px;
  margin:25px auto;
}

.card{
  background:white;
  border-radius:24px;
  padding:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin:10px 0 25px;
}

label{
  display:block;
  font-weight:bold;
  margin:16px 0 8px;
}

textarea{
  width:100%;
  min-height:130px;
  border:1px solid #d1d5db;
  border-radius:14px;
  padding:14px;
  font-size:17px;
}

input[type=file]{
  width:100%;
  padding:12px;
  border:1px dashed #9ca3af;
  border-radius:12px;
}

input[type=color]{
  width:65px;
  height:45px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:18px;
  font-size:18px;
  font-weight:bold;
  background:#4f46e5;
  color:white;
}

button:disabled{
  opacity:.6;
}

#preview{
  width:100%;
  margin-top:15px;
  border-radius:16px;
  display:none;
}

#status{
  text-align:center;
  margin-top:16px;
  font-weight:bold;
}

#download{
  display:none;
  text-align:center;
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  background:#16a34a;
  color:white;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="logo">🎬 Free AI Video Maker</div>

<div class="subtitle">
বাংলা বা English গল্প এবং ছবি দিয়ে ভিডিও তৈরি করুন
</div>

<label>📝 গল্প / অনুভূতি</label>

<textarea id="story"
placeholder="যেমন: একজন ছেলে নদীর পাশে বসে সূর্যাস্ত দেখছে..."></textarea>

<label>🖼️ ছবি Upload করুন</label>

<input type="file" id="imageInput" accept="image/*">

<img id="preview">

<label>🎨 Background</label>

<input type="color" id="bgColor" value="#111827">

<button id="generateBtn" onclick="createVideo()">
🎬 ভিডিও তৈরি করুন
</button>

<div id="status"></div>

<a id="download" download="free-ai-video.webm">
⬇️ ভিডিও Download করুন
</a>

</div>
</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

imageInput.addEventListener("change",function(){

  const file=this.files[0];

  if(file){
    preview.src=URL.createObjectURL(file);
    preview.style.display="block";
  }

});

function createVideo(){

  const story=document.getElementById("story").value.trim();
  const file=imageInput.files[0];
  const bg=document.getElementById("bgColor").value;
  const status=document.getElementById("status");
  const button=document.getElementById("generateBtn");
  const download=document.getElementById("download");

  if(!story){
    alert("আগে গল্প লিখুন।");
    return;
  }

  if(!file){
    alert("আগে একটি ছবি Upload করুন।");
    return;
  }

  if(!window.MediaRecorder){
    alert("এই ব্রাউজারে ভিডিও তৈরি করার সুবিধা নেই। Chrome ব্যবহার করুন।");
    return;
  }

  button.disabled=true;
  download.style.display="none";
  status.innerText="⏳ ভিডিও তৈরি হচ্ছে...";

  const img=new Image();

  img.onload=function(){

    const canvas=document.createElement("canvas");

    canvas.width=720;
    canvas.height=1280;

    const ctx=canvas.getContext("2d");

    const stream=canvas.captureStream(24);

    let mime="";

    if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8")){
      mime="video/webm;codecs=vp8";
    }else if(MediaRecorder.isTypeSupported("video/webm")){
      mime="video/webm";
    }else{
      alert("এই ফোনে WebM ভিডিও তৈরি করা যাচ্ছে না।");
      button.disabled=false;
      return;
    }

    const recorder=new MediaRecorder(stream,{
      mimeType:mime
    });

    const chunks=[];

    recorder.ondataavailable=function(event){

      if(event.data && event.data.size>0){
        chunks.push(event.data);
      }

    };

    recorder.onerror=function(){

      status.innerText="❌ ভিডিও তৈরিতে সমস্যা হয়েছে।";
      button.disabled=false;

    };

    recorder.onstop=function(){

      const blob=new Blob(chunks,{
        type:"video/webm"
      });

      const url=URL.createObjectURL(blob);

      download.href=url;
      download.style.display="block";

      status.innerText="✅ ভিডিও তৈরি হয়েছে!";

      button.disabled=false;

    };

    recorder.start(250);

    const duration=6000;
    const start=Date.now();

    function draw(){

      const elapsed=Date.now()-start;

      let progress=elapsed/duration;

      if(progress>1){
        progress=1;
      }

      /* Background */

      ctx.fillStyle=bg;
      ctx.fillRect(0,0,720,1280);

      /* Image */

      const ratio=img.width/img.height;

      let w=620;
      let h=w/ratio;

      const zoom=1+(progress*0.12);

      w=w*zoom;
      h=h*zoom;

      const x=(720-w)/2;
      const y=120+(500-h/2);

      ctx.drawImage(img,x,y,w,h);

      /* Dark bottom */

      const gradient=ctx.createLinearGradient(
        0,700,0,1280
      );

      gradient.addColorStop(0,"rgba(0,0,0,0)");
      gradient.addColorStop(1,"rgba(0,0,0,.9)");

      ctx.fillStyle=gradient;
      ctx.fillRect(0,650,720,630);

      /* Story */

      ctx.fillStyle="white";
      ctx.textAlign="center";
      ctx.font="bold 36px Arial";

      const words=story.split(/\s+/);
      const lines=[];
      let line="";

      for(let i=0;i<words.length;i++){

        const test=line+words[i]+" ";

        if(ctx.measureText(test).width>620){

          lines.push(line);
          line=words[i]+" ";

        }else{

          line=test;

        }

      }

      if(line){
        lines.push(line);
      }

      const lineHeight=50;
      const startY=1050-(lines.length*lineHeight)/2;

      for(let i=0;i<lines.length;i++){

        ctx.fillText(
          lines[i],
          360,
          startY+(i*lineHeight)
        );

      }

      /* Logo */

      ctx.font="bold 22px Arial";
      ctx.fillStyle="rgba(255,255,255,.8)";

      ctx.fillText(
        "Free AI Video Maker",
        360,
        50
      );

      if(elapsed<duration){

        requestAnimationFrame(draw);

      }else{

        /* Give recorder one final frame */

        setTimeout(function(){

          recorder.stop();

        },500);

      }

    }

    requestAnimationFrame(draw);

    /* Safety stop */

    setTimeout(function(){

      if(recorder.state==="recording"){
        recorder.stop();
      }

    },7500);

  };

  img.onerror=function(){

    status.innerText="❌ ছবিটি পড়তে সমস্যা হয়েছে।";
    button.disabled=false;

  };

  img.src=URL.createObjectURL(file);

}

</script>

</body>
</html>
